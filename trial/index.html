<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e8ebdc"><title>記憶の宮殿 — 山の記憶をたどる</title><link rel="stylesheet" href="style.css"><script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script></head>
<body><main id="app" data-phase="loading">
  <div id="world" aria-label="朝の光が差す、山の神社への坂道。画面をドラッグすると少し見回せます。"></div><div class="shade" aria-hidden="true"></div>
  <header><div class="brand"><span class="emblem" aria-hidden="true">◈</span><div>記憶の宮殿<small>山の記憶をたどる</small></div></div><button id="settingsButton" class="round" aria-label="音と動きの設定" title="設定">☷</button></header>
  <nav id="progress" aria-label="学びの進み具合"><strong id="progressLabel">まず3つの場所へ</strong><ol><li><span>1</span><small>下見</small></li><li><span>2</span><small>結ぶ</small></li><li><span>3</span><small>想起</small></li></ol></nav>
  <div id="loading" role="status"><span class="spinner"></span><b>山の道を準備しています</b><small id="loadProgress">木々と坂道を読み込み中</small></div>
  <section id="actionCard" hidden aria-labelledby="cardTitle" aria-live="polite">
    <div id="cardHead"><div id="itemArt" aria-hidden="true"></div><div class="cardCopy"><div id="eyebrow"></div><h1 id="cardTitle"></h1><p id="cardText"></p></div></div>
    <div id="formArea"></div><div id="choices" role="group"></div><div id="feedback" role="status"></div>
    <div class="actions"><button id="primary"></button><button id="secondary" class="textButton" hidden></button></div>
  </section>
  <div id="travel" hidden role="status"></div><div id="saveWarning" hidden role="status"></div>
  <footer><span id="footerStatus">体験版・入口の3地点</span></footer>
  <dialog id="settings"><div class="dialogHead"><h2>心地よく歩くために</h2><button id="closeSettings" class="round" aria-label="設定を閉じる">×</button></div><label><span>音を鳴らす<small>初期設定はOFFです</small></span><input type="checkbox" id="soundSetting"></label><label><span>動きを減らす<small>カメラ移動と品物の動きを控えます</small></span><input type="checkbox" id="motionSetting"></label><p>途中で閉じても、安定した画面から再開できます。</p><button id="restart" class="quietButton">入口へ戻る</button></dialog>
  <details id="inspect" hidden><summary>検品データ</summary><pre id="metrics"></pre></details>
</main><script type="module" src="app.js"></script></body></html>
