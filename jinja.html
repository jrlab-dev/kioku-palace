<style>

  /* 進み具合（15こなので小さめ） */
  #dots { position:fixed; right:10px; top:50%; transform:translateY(-50%); z-index:11;

  /* 高さ計（どこまで上ったか） */
  #alt { position:fixed; left:12px; top:50%; transform:translateY(-50%); z-index:11;

<script type="module">
import * as THREE from 'three';

/* =========================================================
   記憶の宮殿ゲーム ── 第1の宮殿「山の上の神社」
   ・順路は一本。山道は分岐しないので、平地の境内より確実
   ・場所の性質が勝手にバラバラになる（アスファルト→土→木の橋→石段→境内）
   ・上っていくので「あれは下のほう」という高さの手がかりが増える
   背景はわざと簡素。作り込むと置いたものが埋もれる。
   ========================================================= */

// ---------- 覚える中身 ----------
// 体验セット（運営提供の共通セット）。絵になる品物が記憶術の入門に最適。
// 自分入力モードでは、この ITEMS をユーザーの入力で差し替える。
const MODES = {
  errand: [
    { face:'🥛', name:'ぎゅうにゅう' },
    { face:'🔋', name:'かんでんち' },
    { face:'☂️', name:'かさ' },
    { face:'💊', name:'くすり' },
    { face:'✉️', name:'てがみ' },
    { face:'🍌', name:'バナナ' },
    { face:'🧦', name:'くつした' },
    { face:'🪥', name:'はブラシ' },
    { face:'🍞', name:'パン' },
    { face:'🔑', name:'かぎ' },
    { face:'🧅', name:'たまねぎ' },
    { face:'🕯️', name:'ろうそく' },
    { face:'🧤', name:'てぶくろ' },
    { face:'🍯', name:'はちみつ' },
    { face:'🎈', name:'ふうせん' },
  ],
};
let ITEMS = MODES.errand;

// ---------- 山の高さ（zが小さいほど奥＝高い） ----------
const SLOPE = [
  { z:  45, y:  0.0 }, { z:  22, y:  0.2 }, { z:  14, y:  0.9 }, { z:   4, y:  2.2 },
  { z:  -6, y:  4.4 }, { z: -16, y:  6.4 }, { z: -26, y:  8.4 }, { z: -36, y: 10.6 },
  { z: -46, y: 13.2 }, { z: -54, y: 15.4 }, { z: -64, y: 20.8 }, { z: -70, y: 22.2 },
  { z: -78, y: 22.7 }, { z:-130, y: 23.0 },
];
function groundY(z){
  if(z >= SLOPE[0].z) return SLOPE[0].y;
  for(let i=0;i<SLOPE.length-1;i++){
    const a = SLOPE[i], b = SLOPE[i+1];
    if(z <= a.z && z >= b.z){
      const t = (a.z - z) / (a.z - b.z);
      return a.y + (b.y - a.y) * t;
    }
  }
  return SLOPE[SLOPE.length-1].y;
}

// ---------- 15か所 ----------
// spot の y は「地面からの高さ」、z は「手前へのずらし」（構造物の裏に隠れないように）
// コツは前半5つだけ。15回説教すると押しつけがましくなる。
// 品物は「構造物の横」に置く。真上や真後ろだと裏に隠れる。
// 立ち止まる位置（NEAR_DIST）から4〜5m離れるようにして、場所と品物を両方画面に入れる。
const STATIONS = [
  { z:  30, name:'駐車場',     spot:{x:-3.4, y:1.8}, tipT:'コツ 1／大きくする',
    tipB:'車が押しつぶされるくらい、ばかばかしく大きくして置いてください。小さいものは記憶から消えます。' },
  { z:  22, name:'案内板',     spot:{x: 1.5, y:2.4}, tipT:'コツ 2／変にする',
    tipB:'案内板の地図を突き破って、はみ出させてください。ありえない絵ほど、あとで出てきます。' },
  { z:  14, name:'鳥居',       spot:{x:-4.4, y:4.0}, tipT:'コツ 3／動かす',
    tipB:'柱にぶら下げて、ゆらゆら揺らしてください。止まっているものより、動いているものが残ります。' },
  { z:   4, name:'山道の入口', spot:{x: 1.7, y:2.0}, tipT:'コツ 4／音を出す',
    tipB:'木の柵にぶつけて、カンカン鳴らしてください。音がつくと、思い出す手がかりが増えます。' },
  { z:  -6, name:'丸太の階段', spot:{x: 1.9, y:1.6}, tipT:'コツ 5／自分が関わる',
    tipB:'ながめるのではなく、自分の足で踏んづけてください。自分が動いた記憶は強く残ります。' },
  { z: -16, name:'沢の橋',     spot:{x:-1.3, y:1.9} },
  { z: -26, name:'休憩所',     spot:{x:-3.3, y:2.4} },
  { z: -36, name:'石灯籠',     spot:{x: 2.2, y:3.0} },
  { z: -46, name:'見晴らし台', spot:{x: 7.0, y:2.6} },
  { z: -58, name:'長い石段',   spot:{x:-2.0, y:2.2} },
  { z: -70, name:'手水舎',     spot:{x:-3.1, y:2.2} },
  { z: -80, name:'狛犬',       spot:{x: 2.1, y:3.4} },
  { z: -90, name:'ご神木',     spot:{x:-5.6, y:4.0} },
  { z:-100, name:'賽銭箱',     spot:{x: 1.8, y:2.4} },
  { z:-110, name:'鈴',         spot:{x:-1.4, y:4.2} },
];

const Z_START = 38, Z_END = -110, NEAR_DIST = 4.5;
const PITCH0 = 0.10;
const WALK_SPEED = 11.0;

const S = { phase:'intro', idx:0, placed:[], answers:[], camZ:Z_START, yaw:0, pitch:PITCH0 };

// ---------- 3Dの土台 ----------
const wrap = document.getElementById('canvasWrap');
const scene = new THREE.Scene();
scene.background = null;                       // 空はCSSのグラデーションを透かす
scene.fog = new THREE.Fog(0xcadde8, 50, 165);  // 霧は地平線あたりの色に合わせる

const camera = new THREE.PerspectiveCamera(72, innerWidth/innerHeight, 0.1, 420);
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.NoToneMapping;  // ローポリの平塗りには映画風の調整は合わない（暗部が潰れる）

wrap.appendChild(renderer.domElement);

/* 光は「朝の山」に振る。粗く見える原因はモデルの粗さではなく、
   影が無いことと光が平板なこと。斜めから差す朝日＋影で立体感が出る。 */
// 周囲光を強くすると影が飛ぶ。弱めにして、太陽とのコントラストを作る。
scene.add(new THREE.HemisphereLight(0xd0e4f8, 0x6b7852, 1.0));
const sun = new THREE.DirectionalLight(0xffeccb, 1.45);
sun.position.set(-38, 34, 30);          // 低い朝日。影が長く伸びる
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 260;
sun.shadow.camera.left = -46;
sun.shadow.camera.right = 46;
sun.shadow.camera.top = 46;
sun.shadow.camera.bottom = -46;
sun.shadow.bias = -0.0007;
sun.shadow.normalBias = 0.03;
scene.add(sun);
scene.add(sun.target);
// 影の範囲はカメラについてこさせる（山全体を1枚で覆うと影がぼやける）
function moveSun(){
  sun.position.set(-38, groundY(S.camZ) + 34, S.camZ + 30);
  sun.target.position.set(0, groundY(S.camZ), S.camZ - 6);
  sun.target.updateMatrixWorld();
}

/* 地面の質感。単色ベタ塗りだと、光を直しても「塗り絵」に見える。
   写実的にはせず、ローポリに合う粗い斑点だけ入れる。画像は増やさずその場で描く。 */
function makeGroundTex(base, spotColors, count, cell){
  const cv = document.createElement('canvas');
  cv.width = cv.height = 256;
  const g = cv.getContext('2d');
  g.fillStyle = base; g.fillRect(0, 0, 256, 256);
  for(let i=0;i<count;i++){
    g.fillStyle = spotColors[(Math.random()*spotColors.length)|0];
    g.fillRect(Math.random()*256, Math.random()*256,
               1.5 + Math.random()*cell, 1.5 + Math.random()*cell);
  }
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const texGrass = makeGroundTex('#5c7548', ['#516a3e','#68815049','#496238','#6b8a4e'], 900, 7);
const texSoil  = makeGroundTex('#8a7654', ['#7b6848','#968260','#6d5c40','#a08b66'], 700, 6);

const M = {
  ground : new THREE.MeshLambertMaterial({ map:texGrass }),
  soil   : new THREE.MeshLambertMaterial({ map:texSoil }),
  asphalt: new THREE.MeshLambertMaterial({ color:0x585c60 }),
  line   : new THREE.MeshLambertMaterial({ color:0xdedad0 }),
  red    : new THREE.MeshLambertMaterial({ color:0xcf4a37 }),
  wood   : new THREE.MeshLambertMaterial({ color:0x8f6a45 }),
  darkw  : new THREE.MeshLambertMaterial({ color:0x6a4b31 }),
  roof   : new THREE.MeshLambertMaterial({ color:0x59697a }),
  stone  : new THREE.MeshLambertMaterial({ color:0x9a968c }),
  water  : new THREE.MeshLambertMaterial({ color:0x6fa8c4 }),
  leaf   : new THREE.MeshLambertMaterial({ color:0x3f6634 }),
  leaf2  : new THREE.MeshLambertMaterial({ color:0x4b7a3a }),
  trunk  : new THREE.MeshLambertMaterial({ color:0x5a4530 }),
  gold   : new THREE.MeshLambertMaterial({ color:0xc9a227 }),
  paper  : new THREE.MeshLambertMaterial({ color:0xf4f2ea }),
};

// y は「地面からの高さ」で渡す
function box(w,h,d,mat,x,y,z,ry){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.position.set(x, groundY(z)+y, z); if(ry) m.rotation.y = ry;
  m.castShadow = true; m.receiveShadow = true;
  scene.add(m); return m;
}
function cyl(rt,rb,h,mat,x,y,z,seg){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg||10), mat);
  m.position.set(x, groundY(z)+y, z);
  m.castShadow = true; m.receiveShadow = true;
  scene.add(m); return m;
}

/* ---------- 屋根の道具 ----------
   平らな箱を重ねたままだと、光を直しても建物に見えない。傾きを付ける。 */

// 切妻屋根（棟が横に走る。拝殿・案内板用）
function gableRoof(w, d, rise, mat, x, y, z, thick){
  const half = d/2, len = Math.hypot(rise, half), ang = Math.atan2(rise, half);
  [1,-1].forEach(s=>{
    const p = new THREE.Mesh(new THREE.BoxGeometry(w, thick||0.34, len), mat);
    p.position.set(x, groundY(z) + y + rise/2, z + s*half/2);
    p.rotation.x = -s * ang;
    p.castShadow = true; p.receiveShadow = true;
    scene.add(p);
  });
}

// 方形屋根（四方に下る。手水舎・休憩所・灯籠の笠用）
function pyramidRoof(size, rise, mat, x, y, z){
  const m = new THREE.Mesh(new THREE.ConeGeometry(size*0.707, rise, 4), mat);
  m.rotation.y = Math.PI/4;
  m.position.set(x, groundY(z) + y + rise/2, z);
  m.castShadow = true; m.receiveShadow = true;
  scene.add(m); return m;
}

// 千木と鰹木（これがあると一気に神社に見える）
function chigiKatsuo(w, d, mat, x, y, z, n){
  for(let i=0;i<(n||5);i++){                       // 鰹木：棟に横たわる丸太
    const k = new THREE.Mesh(new THREE.CylinderGeometry(0.28,0.28,1.9,8), mat);
    k.rotation.x = Math.PI/2;
    k.position.set(x - w/2 + w*(i+0.5)/(n||5), groundY(z)+y+0.28, z);
    k.castShadow = true; scene.add(k);
  }
  [-1,1].forEach(s=>{                              // 千木：両端でX字に交差
    [-1,1].forEach(t=>{
      const c = new THREE.Mesh(new THREE.BoxGeometry(0.24, 3.4, 0.24), mat);
      c.position.set(x + s*(w/2 - 0.3), groundY(z)+y+1.0, z + t*0.55);
      c.rotation.x = t * 0.42;
      c.castShadow = true; scene.add(c);
    });
  });
}

// ---------- 地面と道（山の斜面に沿わせる） ----------
(function(){
  const g = new THREE.PlaneGeometry(320, 210, 6, 105);
  g.rotateX(-Math.PI/2);
  const OFF = -40;
  const p = g.attributes.position;
  for(let i=0;i<p.count;i++) p.setY(i, groundY(p.getZ(i) + OFF));
  g.computeVertexNormals();
  texGrass.repeat.set(26, 32);
  const m = new THREE.Mesh(g, M.ground);
  m.receiveShadow = true;
  m.position.z = OFF; scene.add(m);
})();

(function(){
  const g = new THREE.PlaneGeometry(4.6, 180, 1, 180);
  g.rotateX(-Math.PI/2);
  const OFF = -35;
  const p = g.attributes.position;
  for(let i=0;i<p.count;i++) p.setY(i, groundY(p.getZ(i) + OFF) + 0.03);
  g.computeVertexNormals();
  texSoil.repeat.set(2, 62);
  const m = new THREE.Mesh(g, M.soil);
  m.receiveShadow = true;
  m.position.z = OFF; scene.add(m);
})();

let skyMesh, skyTexDraw;

/* ---------- 遠景（見晴らし台から見える山並み） ----------
   遠くの山を3Dで作るのは無駄なので、絵を1枚の板に貼る（ゲームでは昔からの定石）。
   ただし画像ファイルを別に置くと file:// で読めずダブルクリック起動が壊れるため、
   絵はその場で描いてテクスチャにする。1ファイル完結を保つ。            */
(function(){
  const cv = document.createElement('canvas');
  cv.width = 2048; cv.height = 512;
  const g = cv.getContext('2d');
  const BASE = 300;                         // 山の裾（ここから下は木と地面に隠れる）
  // 空の色(168,202,221)に近すぎると溶けて消える。濃いめ・不透明寄りにする。
  // 峰は少なく大きく。細かいギザギザだと「遠くの山脈」に見えない。
  const layers = [                          // 奥ほど淡く、峰を高く
    { hi: 30, lo:120, color:'rgba(116,148,172,0.88)', n:4 },
    { hi: 80, lo:170, color:'rgba(92,124,150,0.92)',  n:5 },
    { hi:130, lo:215, color:'rgba(68,98,124,0.96)',   n:7 },
    { hi:185, lo:265, color:'rgba(50,76,98,1.0)',     n:9 },
  ];
  layers.forEach(L=>{
    g.fillStyle = L.color;
    g.beginPath();
    g.moveTo(0, cv.height);
    const step = cv.width / L.n;
    for(let i=0;i<=L.n;i++){
      const x = i*step;
      g.lineTo(x - step*0.5, BASE);                       // 谷
      g.lineTo(x, L.hi + Math.random()*(L.lo - L.hi));    // 峰
    }
    g.lineTo(cv.width, cv.height);
    g.closePath(); g.fill();
  });
  // 1枚の板だと霧に溶けて消える上、向きを変えると外れる。
  // 筒の内側に貼って山をぐるりと囲む（スカイドームの簡易版）。fog は切る。
  skyTexDraw = new THREE.CanvasTexture(cv);
  skyMesh = new THREE.Mesh(
    new THREE.CylinderGeometry(150, 150, 92, 48, 1, true),
    new THREE.MeshBasicMaterial({ map:skyTexDraw, transparent:true,
                                  side:THREE.BackSide, depthWrite:false, fog:false })
  );
  skyMesh.position.set(0, 41, -40);
  scene.add(skyMesh);
})();

(function(){
  const btn = document.getElementById('skyToggle');
  if(!ENKEI_URI) return;                       // 絵が無いときはボタンを出さない
  const tex = new THREE.TextureLoader().load(ENKEI_URI);
  tex.colorSpace = THREE.SRGBColorSpace;
  // 生成画像は稜線が絵の中ほどにある。線がき版と同じ高さに来るよう縦を合わせる。
  // 合わせないと山が手前の木に隠れてしまい、見比べにならない。
  tex.repeat.set(1, 0.78);
  tex.offset.set(0, -0.05);
  btn.classList.remove('hidden');
  let usePhoto = false;
  btn.onclick = ()=>{
    usePhoto = !usePhoto;
    skyMesh.material.map = usePhoto ? tex : skyTexDraw;
    skyMesh.material.needsUpdate = true;
    btn.textContent = usePhoto ? '遠景：生成画像' : '遠景：線がき';
  };
})();

// ---------- ③ 鳥居（ふもと） ----------
/* 実物の形：柱はわずかに内へ傾き（転び）、笠木は両端が反り上がる。
   貫は柱を突き抜け、その上に額束が立つ。台石が根元を締める。 */
(function(){
  const z = 14, PX = 2.95, H = 6.9;
  [-1, 1].forEach(s=>{
    box(1.25, 0.5, 1.25, M.stone, s*PX, 0.25, z);            // 台石
    const p = new THREE.Mesh(new THREE.CylinderGeometry(0.30, 0.38, H, 12), M.red);
    p.position.set(s*PX, groundY(z) + H/2 + 0.4, z);
    p.rotation.z = -s * 0.028;                                // 転び（内へ傾ける）
    p.castShadow = true; p.receiveShadow = true;
    scene.add(p);
  });
  box(7.9, 0.42, 0.66, M.red, 0, 5.6, z);                     // 貫（柱を突き抜ける）
  box(0.85, 0.95, 0.5, M.red, 0, 6.4, z);                     // 額束
  box(7.2, 0.5, 0.86, M.darkw, 0, 7.15, z);                   // 島木

  // 笠木は反らせる。板を分割して両端を持ち上げる
  // 反りは控えめに。強くすると板の継ぎ目が段々に見えてしまう。
  const SEG = 15, W = 9.1, A = 1.25;                          // A = 反りの強さ
  for(let i=0;i<SEG;i++){
    const t = (i + 0.5)/SEG - 0.5;                            // -0.5 〜 0.5
    const b = new THREE.Mesh(new THREE.BoxGeometry(W/SEG + 0.16, 0.4, 1.02), M.darkw);
    b.position.set(t*W, groundY(z) + 7.55 + t*t*A, z);
    b.rotation.z = -Math.atan(2*A*t / W);                     // 曲線の傾きに合わせる
    b.castShadow = true; b.receiveShadow = true;
    scene.add(b);
  }
})();

// ---------- ④ 山道の入口（木の柵と杭） ----------
(function(){

// face は emoji（体验セット）にも、テキスト（漢字・語句。自分入力）にもなる。
function makeSprite(face){
  const cv = document.createElement('canvas');
  cv.width = cv.height = 256;
  const g = cv.getContext('2d');
  g.textAlign='center'; g.textBaseline='middle';
  const chars = [...face];
  const isEmoji = chars.length <= 2 && /\p{Extended_Pictographic}/u.test(face);
  if(isEmoji){
    g.font = '190px serif';
    g.fillText(face, 128, 140);
  } else {
    // テキスト：文字数でサイズ調整。白丸背景を描いて、何が置いてあるか読めるようにする。
    const len = chars.length;
    const fs = len <= 2 ? 110 : len <= 4 ? 78 : len <= 6 ? 56 : 42;
    g.fillStyle = 'rgba(255,255,255,.96)';
    g.beginPath(); g.arc(128,128,124,0,Math.PI*2); g.fill();
    g.fillStyle = '#1a1f2b';
    g.font = `800 ${fs}px "Hiragino Sans","Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif`;
    g.fillText(face, 128, 132);
  }
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map:new THREE.CanvasTexture(cv), transparent:true }));
  sp.scale.set(1.75,1.75,1);
  return sp;
}
const placedSprites = [];
function placeItemAt(stIdx, item){
  const st = STATIONS[stIdx];
  const sp = makeSprite(item.face);
  const y = groundY(st.z) + st.spot.y;
  sp.position.set(st.spot.x, y, st.z + (st.spot.z || 0));
  sp.userData.baseY = y;
  sp.userData.seed = stIdx * 1.7;
  scene.add(sp);
  placedSprites.push(sp);
  aimAt(sp.position);
}
function clearSprites(){
  placedSprites.forEach(s=>scene.remove(s));
  placedSprites.length = 0;
}

let aimTarget = null;
function aimAt(pos){
  const dx = pos.x - camera.position.x;
  const dy = pos.y - camera.position.y;
  const dz = pos.z - camera.position.z;
  const flat = Math.hypot(dx, dz);
  aimTarget = { yaw:Math.atan2(-dx,-dz), pitch:Math.max(-0.75, Math.min(0.95, Math.atan2(dy, flat))) };
}

let dragging=false, lastX=0, lastY=0;
const dom = renderer.domElement;
dom.addEventListener('pointerdown', e=>{ dragging=true; lastX=e.clientX; lastY=e.clientY; });
dom.addEventListener('pointermove', e=>{
  if(!dragging) return;
  const dx=e.clientX-lastX, dy=e.clientY-lastY;
  lastX=e.clientX; lastY=e.clientY;
  aimTarget = null;
  S.yaw   -= dx*0.005;
  S.pitch  = Math.max(-0.75, Math.min(0.95, S.pitch - dy*0.004));
});

  el.addEventListener('pointerleave', off);

}

/* ---------- 復習（間隔反復） ----------
   コンビニ版・自分の家版と同じ仕組み。保存先(palace_srs)も共通で、
   palace の値（jinja / conbini / home）で宮殿を見分ける。 */
const SRS_KEY = 'palace_srs';
const SRS_DAYS = [1, 3, 7, 14, 30, 60];
function ymd(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function todayStr(){ return ymd(new Date()); }
function addDays(n){ const d = new Date(); d.setDate(d.getDate() + n); return ymd(d); }
function loadSRS(){ try{ return JSON.parse(localStorage.getItem(SRS_KEY) || '[]'); }catch(e){ return []; } }
function saveSRS(a){ try{ localStorage.setItem(SRS_KEY, JSON.stringify(a)); }catch(e){} }
function dueSRS(){ const t = todayStr(); return loadSRS().filter(x => (x.palace||'conbini') === 'jinja' && x.next <= t); }
function registerSRS(score, total){
  const list = loadSRS();
  list.push({ id:'j' + Date.now(), palace:'jinja', count:STATIONS.length,
    items: ITEMS.slice(0, STATIONS.length).map(i=>({ face:i.face, name:i.name })),
    stage:0, next:addDays(SRS_DAYS[0]), created:todayStr(),
    history:[{ date:todayStr(), score, total }] });
  saveSRS(list); return SRS_DAYS[0];
}
function updateSRS(id, score, total){
  const list = loadSRS(), it = list.find(x => x.id === id);
  if(!it) return SRS_DAYS[0];
  const rate = total ? score / total : 0;
  if(rate >= 0.8)      it.stage = Math.min(it.stage + 1, SRS_DAYS.length - 1);
  else if(rate < 0.5)  it.stage = 0;
  it.next = addDays(SRS_DAYS[it.stage]);
  it.history.push({ date:todayStr(), score, total });
  saveSRS(list); return SRS_DAYS[it.stage];
}
function startReview(rec){
  S.srsId = rec.id;
  ITEMS = rec.items.slice();
  startReverse();
}

    <ol>
      <li>山道を上って、${STATIONS.length}か所に品物を置く</li>
      <li>品物を消して、もう一度同じ道を歩く</li>
      <li>各場所で「ここに何を置いた？」に答える</li>
      <li>最後に、逆から言えるか試す</li>
    </ol>
    <div class="tipBox">
      <div class="t">山の神社を選んだ理由</div>
      <div class="b">山道は<b>分岐しない</b>ので、順番が一つしかありません。しかも駐車場・土の道・木の橋・石段…と場所の性質がどんどん変わるので、似た場所が並びません。<b>上っていく</b>ぶん「あれは下のほう」という手がかりも増えます。</div>
    </div>
    <button class="bigBtn" id="startBtn">駐車場からはじめる</button>
    <button class="bigBtn" id="backToMode" style="background:#39424f;color:#dbe2ea;margin-top:10px">モード選択にもどる</button>
  `);
  document.getElementById('startBtn').onclick = startPlace;
  document.getElementById('backToMode').onclick = showModeSelect;
}

// ---------- 置く ----------
function startPlace(){
  hideOverlay();
  S.phase='place'; S.idx=0; S.placed=[]; S.camZ=Z_START; S.yaw=0; S.pitch=PITCH0;
  clearSprites(); setWalkVisible(true); updatePlaceUI();
}
function updatePlaceUI(){
  const st = STATIONS[S.idx], item = ITEMS[S.idx];
  el.card.classList.remove('hidden');
  el.emoji.textContent = item.face;
  el.iname.textContent = item.name;
  say('おく（' + (S.idx+1) + '／' + STATIONS.length + '）',
      st.name + 'まで歩いてください', '「すすむ」を押しっぱなしで進みます');
  paintDots();
}
function askPlace(){
  const st = STATIONS[S.idx], item = ITEMS[S.idx];
  walk = 0; setWalkVisible(false);
  const tip = st.tipB
    ? `<div class="tipBox"><div class="t">${st.tipT}</div><div class="b">${st.tipB}</div></div>` : '';
  showOverlay(`
    <h2>${S.idx+1}／${STATIONS.length}　${st.name}</h2>
    <h1>${item.face} ${item.name} を、ここに置きます</h1>
    ${tip}
    <p>目をつぶって、その絵を3秒だけ思い浮かべてから押してください。</p>
    <button class="bigBtn" id="placeBtn">${st.name}に置いた</button>
  `);
  document.getElementById('placeBtn').onclick = ()=>{
    hideOverlay();
    placeItemAt(S.idx, item);
    S.placed.push({ st:S.idx, item });
    S.idx++;
    if(S.idx >= STATIONS.length){
      // 最後の品物を置いたら、すぐ折り返しへ行かず、その場所の絵を見せる。
      // （すぐおしまい画面にすると、最後に置いたものが覚えられない）
      el.card.classList.add('hidden');
      say('おく（' + STATIONS.length + '／' + STATIONS.length + '）',
          'すべて置き終わりました', 'いま置いた絵をよく見て、頭に焼きつけてください');
      setTimeout(startTurn, 2400);
    }
    else { setWalkVisible(true); updatePlaceUI(); }
  };
}

// ---------- 折り返し ----------
function startTurn(){
  S.phase='turn';
  el.card.classList.add('hidden');
  setWalkVisible(false);
  showOverlay(`
    <h2>おきおわり</h2>
    <h1>${STATIONS.length}こ、置き終わりました</h1>
    <p>ここで品物を消します。そして、もう一度駐車場から同じ道を上ります。</p>
    <p>思い出そうと <b>力まないでください</b>。場所に着けば、勝手に出てきます。出てこなかったら、それはその場所の置き方が弱かった、というだけです。</p>
    <button class="bigBtn" id="recallBtn">駐車場に戻って歩きなおす</button>
  `);
  document.getElementById('recallBtn').onclick = ()=>{
    hideOverlay(); clearSprites();
    S.phase='recall'; S.idx=0; S.answers=[]; S.camZ=Z_START; S.yaw=0; S.pitch=PITCH0;
    setWalkVisible(true); updateRecallUI();
  };
}

// ---------- 思い出す ----------
function updateRecallUI(){
  const st = STATIONS[S.idx];
  el.card.classList.add('hidden');
  say('おもいだす（' + (S.idx+1) + '／' + STATIONS.length + '）',
      st.name + 'まで歩いてください', 'まわりを見まわすと出てきやすくなります');
  paintDots();
}
/* その場所のほうを向く。正面を向いたままだと、横にあるもの（ご神木・手水舎など）が
   画面に入らず、別の場所の景色を見ながら答えることになる。 */
function lookAtStation(i){
  const st = STATIONS[i];
  const camY = groundY(S.camZ) + 1.6;
  const dx = st.spot.x;
  const dy = (groundY(st.z) + st.spot.y) - camY;
  const dz = (st.z + (st.spot.z || 0)) - S.camZ;
  S.yaw   = Math.atan2(-dx, -dz);
  S.pitch = Math.max(-0.75, Math.min(0.95, Math.atan2(dy, Math.hypot(dx, dz))));
  aimTarget = null;
}

function pickOptions(correct){
  const others = ITEMS.filter(x=>x!==correct);
  const pick = [];
  while(pick.length < 3 && others.length){
    pick.push(others.splice(Math.floor(Math.random()*others.length),1)[0]);
  }
  return [correct, ...pick].sort(()=>Math.random()-0.5);
}
function askRecall(){
  const st = STATIONS[S.idx], correct = ITEMS[S.idx];
  walk = 0; setWalkVisible(false);
  lookAtStation(S.idx);
  el.center.innerHTML = '';
  const tag = document.createElement('div');
  tag.id='hereTag'; tag.textContent = st.name + '　ここに何を置いた？';
  el.center.appendChild(tag);
  pickOptions(correct).forEach(o=>{
    const b = document.createElement('button');
    b.className='choiceBtn';
    b.textContent = o.face + '　' + o.name;
    b.onclick = ()=>{
      S.answers.push({ st:S.idx, chosen:o, correct, ok:(o===correct) });
      el.center.innerHTML = '';
      placeItemAt(S.idx, correct);
      S.idx++; paintDots();
      if(S.idx >= STATIONS.length) setTimeout(showResult, 650);
      else { setWalkVisible(true); updateRecallUI(); }
    };
    el.center.appendChild(b);
  });
}

// ---------- 行きの結果 ----------
function showResult(){
  S.phase='result';
  setWalkVisible(false);
  const N = STATIONS.length;
  const n = S.answers.filter(a=>a.ok).length;
  const rows = S.answers.map((a,i)=>`
    <div class="resultRow">
      <div class="mk">${a.ok ? '⭕' : '❌'}</div>
      <div>
        <div>${a.correct.face} ${a.correct.name}${a.ok ? '' : '　→ ' + a.chosen.name + ' と答えました'}</div>
        <div class="pl">${STATIONS[i].name}</div>
      </div>
    </div>`).join('');
  const msg = n >= 12
      ? 'ふつうに暗記すると、たいていの人は7つあたりで崩れます。それを大きく超えています。'
      : n >= N*0.6
        ? '外した場所は、置き方が弱かった場所です。もう一度やると必ず上がります。'
        : 'まだ「置いた」だけで「見た」になっていないかもしれません。絵を大きく、変にして置き直してみてください。';
  showOverlay(`
    <h2>けっか</h2>
    <div class="score">${n} / ${N}</div>
    <div class="scoreSub">${msg}</div>
    ${rows}
    <div class="tipBox" style="margin-top:16px">
      <div class="t">次の宮殿</div>
      <div class="b">この山道は、これから何度でも使い回せます。ただし<b>同じ日に何度も使うと、前に置いたものが残って混ざります</b>。2つ目の宮殿（コンビニ）、3つ目（自分の家）と増やしていくのが本筋です。</div>
    </div>
    <button class="bigBtn" id="revBtn">逆から言えるか試す</button>
    <button class="bigBtn" id="againBtn" style="background:#39424f;color:#dbe2ea;margin-top:10px">もう一度やる</button>
  `);
  document.getElementById('revBtn').onclick = startReverse;
  document.getElementById('againBtn').onclick = showModeSelect;
}

/* ---------- 逆から思い出す ----------
   ここが「宮殿が効いているか」の判定。
   丸暗記しただけなら逆順はまず出てこない（順番に引っぱり出しているだけだから）。
   世界チャンピオンの入門課題も、20語を前からも後ろからも言わせる形をとっている。
   3Dは見せない。頭の中だけで歩けることの証明にする。                        */
function startReverse(){
  S.phase='reverse';
  S.rIdx = STATIONS.length - 1;
  S.rAnswers = [];
  setWalkVisible(false);
  el.card.classList.add('hidden');
  clearSprites();
  showOverlay(`
    <h2>ぎゃくから</h2>
    <h1>${STATIONS[STATIONS.length-1].name}から${STATIONS[0].name}へ、山を下ります</h1>
    <p><b>場所の景色は見せます。</b>品物は消してあるので、思い出すのは「そこに何を置いたか」だけです。</p>
    <p>ふつうに丸暗記したものは、逆からはまず出てきません。順番に引っぱり出しているだけだからです。ここで出てくるなら、それは場所を覚えたということです。</p>
    <button class="bigBtn" id="revStartBtn">${STATIONS[STATIONS.length-1].name}からはじめる</button>
  `);
  document.getElementById('revStartBtn').onclick = ()=>{ hideOverlay(); askReverse(); };
}

/* 逆順でも景色を見せる。この山は借り物の場所なので、名前だけだと
   「石灯籠ってどれだっけ」で外れる。それは測りたいものではない。
   測りたいのは「そこに何を置いたか」だけ。だから場所は見せ、品物は消す。 */
function askReverse(){
  const i = S.rIdx, st = STATIONS[i], correct = ITEMS[i];
  const num = STATIONS.length - i;

  // その場所へ移動して景色を見せる（歩かせると倍の時間がかかるので瞬間移動）
  S.camZ = st.z + NEAR_DIST;
  lookAtStation(i);

  say('ぎゃくから（' + num + '／' + STATIONS.length + '）',
      st.name + ' に何を置きましたか', '山を下りながら答えます');
  paintDots();

  el.center.innerHTML = '';
  const tag = document.createElement('div');
  tag.id = 'hereTag'; tag.textContent = st.name;
  el.center.appendChild(tag);
  pickOptions(correct).forEach(o=>{
    const b = document.createElement('button');
    b.className='choiceBtn';
    b.textContent = o.face + '　' + o.name;
    b.onclick = ()=>{
      S.rAnswers.push({ ok:(o===correct), correct, chosen:o, st:i });
      el.center.innerHTML = '';
      S.rIdx--;
      paintDots();
      if(S.rIdx < 0) showReverseResult(); else askReverse();
    };
    el.center.appendChild(b);
  });
}
function showReverseResult(){
  const N = STATIONS.length;
  const n = S.rAnswers.filter(a=>a.ok).length;
  const fwd = S.answers.filter(a=>a.ok).length;
  const rows = S.rAnswers.map(a=>`
    <div class="resultRow">
      <div class="mk">${a.ok ? '⭕' : '❌'}</div>
      <div>
        <div>${a.correct.face} ${a.correct.name}${a.ok ? '' : '　→ ' + a.chosen.name + ' と答えました'}</div>
        <div class="pl">${STATIONS[a.st].name}</div>
      </div>
    </div>`).join('');
  const msg = n >= N*0.8
    ? '逆から言えたなら、それはもう暗記ではありません。頭の中に場所ができています。'
    : n >= N*0.4
      ? '半分は場所から出てきています。順番だけ覚えていた分が、逆にすると落ちます。'
      : '逆にすると出てこない＝まだ「並び」を覚えているだけです。場所に結びつけ直すと変わります。';
  showOverlay(`
    <h2>ぎゃくからの けっか</h2>
    <div class="score">${n} / ${N}</div>
    <div class="scoreSub">${msg}</div>
    ${rows}
    <div class="tipBox" style="margin-top:16px">
      <div class="t">なぜ逆から聞いたか</div>
      <div class="b">ふつうに丸暗記したものは、逆から言えません。順番に引っぱり出しているだけだからです。<br>
      逆から言えたなら、${N}こを覚えたのではなく<b>場所を覚えた</b>ということです。行き（${fwd}／${N}）と帰り（${n}／${N}）を見比べてみてください。</div>
    </div>
    ${S.srsId
      ? `<button class="bigBtn" id="srsBtn" style="background:#e0b830;color:#1a1f2b">復習をおえる</button>`
      : `<button class="bigBtn" id="srsBtn" style="background:#e0b830;color:#1a1f2b;white-space:pre-line">この宮殿を復習カレンダーに入れる
<span style="font-size:12px;font-weight:600;opacity:.75">明日もう一度、逆から聞きます。これをやらないと忘れます</span></button>`}
    <button class="bigBtn" id="againBtn3" style="background:#39424f;color:#dbe2ea;margin-top:10px">もう一度やる</button>
  `);
  document.getElementById('srsBtn').onclick = ()=>{
    const days = S.srsId ? updateSRS(S.srsId, n, N) : registerSRS(n, N);
    const was = S.srsId;
    S.srsId = null;
    showOverlay(`
      <h2>${was ? 'ふくしゅう ずみ' : 'とうろく しました'}</h2>
      <h1>次は ${days}日後 に呼び戻します</h1>
      <p>${was
        ? (n >= N*0.8 ? 'よくできたので、次の間隔をのばしました。' : n >= N*0.5 ? '同じ間隔でもう一度やります。' : '半分より下だったので、明日からやり直します。')
        : '忘れかけたころに聞くのが一番効きます。開始画面に「今日の復習」が出ます。'}</p>
      <p style="margin-top:6px;font-size:13px;opacity:.8">1日後 → 3日後 → 7日後 → 14日後 → 30日後 → 60日後 と、できるほど間隔がのびます。</p>
      <button class="bigBtn" id="srsOk">とじる</button>
    `);
    document.getElementById('srsOk').onclick = showModeSelect;
  };
  document.getElementById('againBtn3').onclick = showModeSelect;
}

// ---------- 毎フレーム ----------
let prevNear = -1;
const clock = new THREE.Clock();
const TOP_Y = groundY(Z_END);
function tick(){
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05);

  if(walk !== 0 && (S.phase==='place' || S.phase==='recall')){
    S.camZ += -walk * WALK_SPEED * dt;
    S.camZ = Math.max(Z_END, Math.min(Z_START, S.camZ));
    aimTarget = null;
    if(!dragging){                       // 歩き出したら前を向き直す
      const k = Math.min(1, dt * 3.0);
      S.yaw   += (0 - S.yaw) * k;
      S.pitch += (PITCH0 - S.pitch) * k;
    }
  }
  if(aimTarget){
    const k = Math.min(1, dt * 4.5);
    S.yaw   += (aimTarget.yaw   - S.yaw)   * k;
    S.pitch += (aimTarget.pitch - S.pitch) * k;
  }

  camera.position.set(0, groundY(S.camZ) + 1.6, S.camZ);
  moveSun();
  camera.rotation.order = 'YXZ';
  camera.rotation.y = S.yaw;
  camera.rotation.x = S.pitch;
  camera.rotation.z = 0;

  el.altFill.style.height = Math.round(groundY(S.camZ) / TOP_Y * 100) + '%';

  const t = clock.getElapsedTime();
  placedSprites.forEach(sp=>{
    sp.position.y = sp.userData.baseY + Math.sin(t*1.8 + sp.userData.seed)*0.26;
  });

  if(S.phase==='place' || S.phase==='recall'){
    const st = STATIONS[S.idx];
    if(st && Math.abs(S.camZ - st.z) < NEAR_DIST && prevNear !== S.idx){
      prevNear = S.idx;
      if(S.phase==='place') askPlace(); else askRecall();
    }
    if(st && Math.abs(S.camZ - st.z) >= NEAR_DIST && prevNear === S.idx){
      if(el.ov.classList.contains('hidden') && el.center.children.length===0) prevNear = -1;
    }
  }

  renderer.render(scene, camera);
}
tick();
showModeSelect();
</script>
